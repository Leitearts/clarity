# Runs weekly to upgrade Python dependencies and opens a pull request
# if any package versions have changed.

name: Update dependencies

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade $(grep -v '^\s*#' requirements.txt | sed 's/[>=<!\[].*//' | tr '\n' ' ')
          pip freeze | grep -f <(grep -v '^\s*#' requirements.txt | sed 's/[>=<].*//' | tr '[:upper:]' '[:lower:]') \
            > /tmp/new_requirements.txt
          cp /tmp/new_requirements.txt requirements.txt

      - name: Upgrade dev dependencies
        run: |
          pip install --upgrade $(grep -v '^\s*#' requirements-dev.txt | sed 's/[>=<!\[].*//' | tr '\n' ' ')
          pip freeze | grep -f <(grep -v '^\s*#' requirements-dev.txt | sed 's/[>=<].*//' | tr '[:upper:]' '[:lower:]') \
            > /tmp/new_requirements_dev.txt
          cp /tmp/new_requirements_dev.txt requirements-dev.txt

      - name: Create pull request with updated dependencies
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update Python dependencies"
          branch: deps/weekly-update-${{ github.run_id }}
          title: "chore: weekly Python dependency update"
          body: |
            Automated pull request created by the **Update dependencies** workflow.

            Upgraded all packages in `requirements.txt` and `requirements-dev.txt`
            to their latest compatible versions.

            Please review the diff and run the test suite before merging.
          labels: |
            automated
            dependencies
          delete-branch: true
